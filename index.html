<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Sp1kkelpoes PS5 Host</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #08090c;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .container {
      width: 100%;
      max-width: 850px;
    }

    .header {
      margin-bottom: 30px;
    }

    .title {
      font-size: 34px;
      font-weight: 700;
      margin: 0;
    }

    .subtitle {
      margin-top: 8px;
      color: #888;
      font-size: 15px;
    }

    .status {
      margin: 20px 0;
      padding: 15px 18px;
      background: #111318;
      border: 1px solid #222630;
      border-radius: 10px;
    }

    .status-dot {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #777;
      margin-right: 8px;
    }

    .section-title {
      margin: 30px 0 12px;
      font-size: 13px;
      color: #777;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 1px solid #292d36;
      border-radius: 10px;
      background: #151820;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d212b;
    }

    button:active {
      transform: scale(.99);
    }

    .primary {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .primary:hover {
      background: #ddd;
    }

    #console {
      margin-top: 30px;
      height: 260px;
      overflow-y: auto;
      padding: 16px;
      background: #030405;
      border: 1px solid #20232a;
      border-radius: 10px;
      color: #b9c0ca;
      font-family: monospace;
      font-size: 13px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1 class="title">PS5 Relapse</h1>
    <div class="subtitle">Sp1kkelpoes Payload Host • Firmware 13.60</div>
  </div>

  <div class="status">
    <span class="status-dot"></span>
    <span id="statusText">Running jailbreak...</span>
  </div>

  <div class="section-title">PAYLOADS</div>

  <div class="grid">
    <button onclick="payload('etaHEN')">
      etaHEN 2.6B
    </button>

    <button onclick="payload('shadowMount')">
      ShadowMount+
    </button>

    <button onclick="payload('kstuff')">
      kstuff
    </button>

    <button class="primary" onclick="payload('loadAll')">
      Load Essentials
    </button>
  </div>

  <div class="section-title">EXPLOIT LOG</div>

  <div id="console"></div>

</div>

<script>
async function payload(name) {
  const status = document.getElementById("statusText");

  if (!window.ps5Payloads) {
    status.textContent = "Payload loader isn't ready yet";
    return;
  }

  const fn = window.ps5Payloads[name];

  if (typeof fn !== "function") {
    status.textContent = "Unknown payload";
    return;
  }

  try {
    status.textContent = "Loading " + name + "...";

    await fn();

    status.textContent = name + " loaded";
  } catch (error) {
    status.textContent = "Failed: " + error.message;

    if (window.writeLog)
      window.writeLog(error.message, "error");
  }
}
</script>

<script src="./src/firmware.js"></script>
<script src="./src/main.js"></script>
<script src="./src/rop.js"></script>
<script src="./src/utils/syscalls.js"></script>
<script type="module" src="./src/site.js"></script>

</body>
</html>
